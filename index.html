<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --primary: #007bff;
            --border: #ddd;
            --overlay: rgba(0,0,0,0.5);
            --whatsapp: #25D366;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --border: #333;
            --overlay: rgba(0,0,0,0.8);
            --whatsapp: #1da851;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .container { padding: 15px; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .card-content { flex-grow: 1; }
        .card-actions { display: flex; gap: 15px; }
        .card-actions button { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .btn-move { color: #ff9800; }
        .btn-edit { color: var(--primary); }
        .btn-delete { color: #ff4444; }
        .item-details { font-size: 0.85rem; color: gray; margin-top: 5px; line-height: 1.4; flex-grow: 1;}
        
        input, select, textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border);
            border-radius: 5px; background: var(--card-bg); color: var(--text-color); box-sizing: border-box; font-size: 16px;
        }
        input[type="file"] { background: transparent; border: none; padding: 0; margin-bottom: 10px; }
        
        button.btn-primary {
            width: 100%; padding: 12px; background-color: var(--primary); color: white;
            border: none; border-radius: 5px; font-size: 1rem; cursor: pointer;
        }
        button.btn-whatsapp {
            width: 100%; padding: 12px; background-color: var(--whatsapp); color: white;
            border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        button.btn-secondary {
            width: 100%; padding: 12px; background-color: transparent; color: var(--text-color);
            border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        
        /* Foto Thumbnails */
        .item-thumbnail {
            width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-right: 15px;
            border: 1px solid var(--border); flex-shrink: 0; cursor: zoom-in;
        }
        .photo-preview-container { text-align: center; margin-bottom: 15px; }
        .photo-preview-container img {
            max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid var(--border);
            display: none; margin: 0 auto;
        }

        /* Modali */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 10px;
            width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; }

        /* Fullscreen Image Viewer */
        #modalImageView .modal-content {
            background: transparent; padding: 0; box-shadow: none; max-width: 100%; text-align: center;
        }
        #modalImageView img {
            max-width: 100%; max-height: 80vh; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .emoji-picker {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;
            max-height: 160px; overflow-y: auto; padding: 10px; 
            border: 1px solid var(--border); border-radius: 5px; background: var(--bg-color);
        }
        .emoji-picker span { font-size: 1.8rem; cursor: pointer; padding: 5px; border-radius: 8px; transition: 0.2s; }
        .emoji-picker span.selected { background-color: var(--primary); transform: scale(1.1); }

        .global-search-bar { position: relative; margin-bottom: 15px; }
        .global-search-bar i { position: absolute; left: 10px; top: 12px; color: gray; }
        .global-search-bar input { padding-left: 35px; margin-bottom: 0; }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background-color: var(--card-bg);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0; padding-bottom: env(safe-area-inset-bottom, 10px); z-index: 50;
        }
        .nav-item { text-align: center; color: gray; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.5rem; display: block; margin-bottom: 3px; }
        .nav-item span { font-size: 0.75rem; }

        .view { display: none; }
        .view.active { display: block; }
        .settings-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <button class="header-btn" id="backBtn" style="visibility: hidden;" onclick="goBack()"><i class="fas fa-chevron-left"></i></button>
        <span id="headerTitle">Inventario</span>
        <button class="header-btn" onclick="showAddModal()"><i class="fas fa-plus"></i></button>
    </header>

    <div id="view-home" class="view active container">
        <div class="global-search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="globalSearchInput" placeholder="Cerca in tutto l'inventario..." onkeyup="performGlobalSearch()">
        </div>
        <div id="globalSearchResults" style="display: none;"></div>
        <div id="macroList"></div>
    </div>

    <div id="view-subcat" class="view container">
        <div id="subcatList"></div>
    </div>

    <div id="view-items" class="view container">
        <input type="text" id="searchItem" placeholder="🔍 Filtra per nome, posizione, note..." onkeyup="renderItems()">
        <div id="itemsList"></div>
    </div>

    <!-- INSERIMENTO RAPIDO (con Foto) -->
    <div id="view-quickadd" class="view container">
        <h3>Aggiungi un nuovo elemento</h3>
        
        <label>Foto (Opzionale)</label>
        <input type="file" id="qaPhotoInput" accept="image/*" onchange="handleImageUpload(event, 'qaPhotoPreview', 'qaRemoveBtn', 'qa')">
        <div class="photo-preview-container">
            <img id="qaPhotoPreview">
            <button class="btn-secondary" id="qaRemoveBtn" style="display:none; padding: 5px; font-size: 0.9rem;" onclick="removeImage('qaPhotoInput', 'qaPhotoPreview', 'qaRemoveBtn', 'qa')">Rimuovi Foto</button>
        </div>

        <input type="text" id="qaName" placeholder="Nome elemento (es. Forno pizza)">
        <input type="number" id="qaQty" placeholder="Quantità" value="1">
        <input type="text" id="qaPos" placeholder="Posizione (es. Scaffale alto...)">
        <textarea id="qaNotes" placeholder="Note (es. Marchio, stato...)"></textarea>
        
        <label>Seleziona Dove Inserirlo:</label>
        <select id="qaMacro" onchange="updateSubcatSelect('qaMacro', 'qaSubcat')"></select>
        <select id="qaSubcat"></select>
        
        <button class="btn-primary" onclick="saveQuickAdd()">Aggiungi all'Inventario</button>
    </div>

    <div id="view-settings" class="view container">
        <div class="settings-row">
            <span>Tema Scuro</span>
            <input type="checkbox" id="themeToggle" onchange="toggleTheme()" style="width: auto;">
        </div>
        <div class="settings-row">
            <span>Ultimo Backup:</span>
            <span id="lastBackupDate">Mai</span>
        </div>
        <button class="btn-primary" style="margin-top: 15px;" onclick="openModal('modalExport')">Esporta Backup</button>
        
        <div style="margin-top: 30px;">
            <h4>Ripristina Backup</h4>
            <input type="file" id="importFile" accept=".json">
            <button class="btn-primary" onclick="importData()">Carica Backup</button>
        </div>
    </div>

    <!-- MODALI VARI -->
    <div id="modalExport" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <h3>Esporta Dati</h3>
            <p style="color: gray; margin-bottom: 20px;">Come preferisci esportare il tuo file di backup?</p>
            <button class="btn-primary" onclick="downloadLocal()"><i class="fas fa-download"></i> Scarica sul telefono</button>
            <button class="btn-whatsapp" onclick="shareBackup()"><i class="fab fa-whatsapp"></i> Condividi (WhatsApp / AirDrop)</button>
            <button class="btn-secondary" onclick="closeModal('modalExport')">Annulla</button>
        </div>
    </div>

    <div id="modalCategory" class="modal-overlay">
        <div class="modal-content">
            <h3 id="catModalTitle">Nuova Zona</h3>
            <label>Nome</label>
            <input type="text" id="catName" placeholder="Inserisci il nome...">
            <label>Scegli un'icona (Attuale: <span id="currentCatIcon">📁</span>)</label>
            <div class="emoji-picker" id="emojiPicker"></div>
            <input type="hidden" id="catIcon" value="📁">
            <button class="btn-primary" onclick="saveCategory()">Salva</button>
            <button class="btn-secondary" onclick="closeModal('modalCategory')">Annulla</button>
        </div>
    </div>

    <!-- MODALE DI MODIFICA ELEMENTO (con Foto) -->
    <div id="modalEdit" class="modal-overlay">
        <div class="modal-content">
            <h3>Modifica Elemento</h3>
            
            <label>Foto</label>
            <input type="file" id="editPhotoInput" accept="image/*" onchange="handleImageUpload(event, 'editPhotoPreview', 'editRemoveBtn', 'edit')">
            <div class="photo-preview-container">
                <img id="editPhotoPreview">
                <button class="btn-secondary" id="editRemoveBtn" style="display:none; padding: 5px; font-size: 0.9rem;" onclick="removeImage('editPhotoInput', 'editPhotoPreview', 'editRemoveBtn', 'edit')">Rimuovi Foto</button>
            </div>

            <label>Nome</label>
            <input type="text" id="editName">
            <label>Quantità</label>
            <input type="number" id="editQty">
            <label>Posizione</label>
            <input type="text" id="editPos">
            <label>Note</label>
            <textarea id="editNotes"></textarea>
            <button class="btn-primary" onclick="saveEdit()">Salva Modifiche</button>
            <button class="btn-secondary" onclick="closeModal('modalEdit')">Annulla</button>
        </div>
    </div>

    <div id="modalMove" class="modal-overlay">
        <div class="modal-content">
            <h3>Sposta Elemento</h3>
            <p id="moveItemName" style="margin-top:0; color: gray;"></p>
            <label>Nuova Zona</label>
            <select id="moveMacro" onchange="updateSubcatSelect('moveMacro', 'moveSubcat')"></select>
            <label>Nuova Sottocategoria</label>
            <select id="moveSubcat"></select>
            <label>Nuova Posizione (Opzionale)</label>
            <input type="text" id="movePos" placeholder="Es. Scaffale basso">
            <button class="btn-primary" onclick="saveMove()">Sposta Elemento</button>
            <button class="btn-secondary" onclick="closeModal('modalMove')">Annulla</button>
        </div>
    </div>

    <!-- MODALE PER VEDERE LA FOTO INGRANDITA -->
    <div id="modalImageView" class="modal-overlay" onclick="closeModal('modalImageView')">
        <div class="modal-content">
            <img id="fullSizeImage" src="">
            <p style="color: white; margin-top: 10px;">Tocca ovunque per chiudere</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="navigate('home')" id="nav-home"><i class="fas fa-boxes"></i><span>Sfoglia</span></div>
        <div class="nav-item" onclick="navigate('quickadd')" id="nav-quickadd"><i class="fas fa-bolt"></i><span>Inserisci</span></div>
        <div class="nav-item" onclick="navigate('settings')" id="nav-settings"><i class="fas fa-cog"></i><span>Opzioni</span></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

        let db = JSON.parse(localStorage.getItem('inventoryDB')) || [];
        let currentMacroId = null;
        let currentSubId = null;
        let editingItemIndex = null;
        let viewStack = ['home']; 
        
        let catModalMode = ''; 
        let catTargetIndex = null;
        const emojiList = ['🏠','🏖️','🏢','🚗','📦','🗄️','🧰','📚','👕','👟','🍽️','💻','🚲','🪴','🧸','🍷','🛁','🛏️','🛋️','🔧','🧹','🕹️','🧳','🎨','📁'];

        // Variabili per tenere in memoria le foto (compresse in Base64) prima di salvare
        let qaPhotoBase64 = null;
        let editPhotoBase64 = null;

        function init() {
            if(localStorage.getItem('theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').checked = true;
            }
            document.getElementById('lastBackupDate').innerText = localStorage.getItem('lastBackup') || 'Mai';
            populateEmojiPicker();
            renderHome();
        }

        function saveDB() { localStorage.setItem('inventoryDB', JSON.stringify(db)); }

        function navigate(viewName, title = "Inventario", addStack = true, params = {}) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(document.getElementById('nav-' + viewName)) document.getElementById('nav-' + viewName).classList.add('active');

            document.getElementById('headerTitle').innerText = title;
            if (addStack && viewStack[viewStack.length - 1] !== viewName) viewStack.push(viewName);
            document.getElementById('backBtn').style.visibility = viewStack.length > 1 ? 'visible' : 'hidden';

            if(viewName === 'home') {
                viewStack = ['home'];
                document.getElementById('backBtn').style.visibility = 'hidden';
                document.getElementById('globalSearchInput').value = '';
                performGlobalSearch();
                renderHome();
            } else if (viewName === 'quickadd') {
                populateMacroSelects('qaMacro', 'qaSubcat', params.macroId, params.subId);
            }
        }

        function goBack() {
            if (viewStack.length > 1) {
                viewStack.pop(); 
                let prevView = viewStack.pop(); 
                if(prevView === 'subcat') openMacro(currentMacroId);
                else if(prevView === 'items') openSubcat(currentSubId);
                else if(prevView === 'home') navigate('home');
                else navigate(prevView);
            }
        }

        // --- SISTEMA DI COMPRESSIONE FOTO ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    // Limite massimo dimensioni (es. 800px)
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compressione a JPEG qualità 60% (riduce drasticamente il peso in KB)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    callback(dataUrl);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function handleImageUpload(event, previewId, removeBtnId, type) {
            const file = event.target.files[0];
            if (!file) return;

            compressImage(file, function(base64) {
                document.getElementById(previewId).src = base64;
                document.getElementById(previewId).style.display = 'block';
                document.getElementById(removeBtnId).style.display = 'inline-block';
                
                if(type === 'qa') qaPhotoBase64 = base64;
                else editPhotoBase64 = base64;
            });
        }

        function removeImage(inputId, previewId, removeBtnId, type) {
            document.getElementById(inputId).value = '';
            document.getElementById(previewId).src = '';
            document.getElementById(previewId).style.display = 'none';
            document.getElementById(removeBtnId).style.display = 'none';
            
            if(type === 'qa') qaPhotoBase64 = null;
            else editPhotoBase64 = null;
        }

        function viewFullImage(src) {
            document.getElementById('fullSizeImage').src = src;
            openModal('modalImageView');
        }
        // ------------------------------------

        function renderHome() {
            const list = document.getElementById('macroList');
            list.innerHTML = '';
            db.forEach((macro, index) => {
                list.innerHTML += `
                    <div class="card" onclick="openMacro(${index})">
                        <div class="card-content"><strong>${macro.icon} ${macro.name}</strong></div>
                        <div class="card-actions" onclick="event.stopPropagation()">
                            <button class="btn-edit" onclick="openCategoryModal('editMacro', ${index})"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete" onclick="deleteMacro(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            list.innerHTML += `<button class="btn-primary" onclick="openCategoryModal('addMacro')" style="margin-top:10px;">+ Nuova Zona</button>`;
        }

        function performGlobalSearch() {
            const term = document.getElementById('globalSearchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('globalSearchResults');
            const macroList = document.getElementById('macroList');
            
            if (!term) { resultsContainer.style.display = 'none'; macroList.style.display = 'block'; return; }
            resultsContainer.style.display = 'block'; macroList.style.display = 'none'; resultsContainer.innerHTML = '';
            
            let found = 0;
            db.forEach((macro, mIdx) => {
                macro.subcats.forEach((sub, sIdx) => {
                    sub.items.forEach((item) => {
                        const searchString = `${item.name} ${item.pos} ${item.notes} ${item.qty}`.toLowerCase();
                        if (searchString.includes(term)) {
                            found++;
                            resultsContainer.innerHTML += `
                                <div class="card" style="align-items: flex-start;" onclick="jumpToSubcat(${mIdx}, ${sIdx})">
                                    ${item.image ? `<img src="${item.image}" class="item-thumbnail">` : ''}
                                    <div class="item-details" style="margin-top:0;">
                                        <strong style="font-size:1.1rem; color: var(--text-color);">${item.name} (x${item.qty})</strong><br>
                                        <span style="color: var(--primary); font-weight:bold;">${macro.icon} ${macro.name} > ${sub.icon} ${sub.name}</span><br>
                                        ${item.pos ? '📍 ' + item.pos + '<br>' : ''}
                                    </div>
                                </div>`;
                        }
                    });
                });
            });
            if (found === 0) resultsContainer.innerHTML = '<p style="text-align:center; color:gray;">Nessun oggetto trovato.</p>';
        }

        function jumpToSubcat(mIdx, sIdx) {
            document.getElementById('globalSearchInput').value = ''; performGlobalSearch();
            currentMacroId = mIdx; navigate('subcat', db[mIdx].name); openSubcat(sIdx);
        }

        function openMacro(index) {
            currentMacroId = index;
            const macro = db[index];
            const list = document.getElementById('subcatList');
            list.innerHTML = '';
            if(!macro.subcats) macro.subcats = [];
            
            macro.subcats.forEach((sub, subIndex) => {
                list.innerHTML += `
                    <div class="card" onclick="openSubcat(${subIndex})">
                        <div class="card-content"><strong>${sub.icon} ${sub.name}</strong></div>
                        <div class="card-actions" onclick="event.stopPropagation()">
                            <button class="btn-edit" onclick="openCategoryModal('editSubcat', ${subIndex})"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete" onclick="deleteSubcat(${subIndex})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            list.innerHTML += `<button class="btn-primary" onclick="openCategoryModal('addSubcat')" style="margin-top:10px;">+ Nuova Sottocategoria</button>`;
            navigate('subcat', macro.name);
        }

        function openSubcat(subIndex) {
            currentSubId = subIndex;
            const sub = db[currentMacroId].subcats[subIndex];
            document.getElementById('searchItem').value = '';
            navigate('items', sub.name);
            renderItems();
        }

        function renderItems() {
            const sub = db[currentMacroId].subcats[currentSubId];
            const list = document.getElementById('itemsList');
            const searchTerm = document.getElementById('searchItem').value.toLowerCase();
            list.innerHTML = '';
            let itemCount = 0;

            sub.items.forEach((item, itemIndex) => {
                const searchString = `${item.name} ${item.pos} ${item.notes} ${item.qty}`.toLowerCase();
                if (searchString.includes(searchTerm)) {
                    itemCount++;
                    list.innerHTML += `
                        <div class="card" style="align-items: flex-start;">
                            ${item.image ? `<img src="${item.image}" class="item-thumbnail" onclick="viewFullImage('${item.image}')">` : ''}
                            
                            <div style="flex-grow: 1; display:flex; flex-direction:column;">
                                <div style="display: flex; justify-content: space-between; width: 100%; align-items:flex-start;">
                                    <strong style="font-size:1.1rem; line-height:1.2;">${item.name} (x${item.qty})</strong>
                                    <div class="card-actions" style="gap:5px;">
                                        <button class="btn-move" onclick="openMoveModal(${itemIndex})" title="Sposta"><i class="fas fa-exchange-alt"></i></button>
                                        <button class="btn-edit" onclick="openEditModal(${itemIndex})" title="Modifica"><i class="fas fa-edit"></i></button>
                                        <button class="btn-delete" onclick="deleteItem(${itemIndex})" title="Elimina"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                                <div class="item-details">
                                    ${item.pos ? '📍 ' + item.pos + '<br>' : ''}
                                    ${item.notes ? '📝 ' + item.notes : ''}
                                </div>
                            </div>
                        </div>`;
                }
            });
            if (itemCount === 0) list.innerHTML = `<p style="text-align:center; color:gray;">Nessun elemento trovato.</p>`;
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function populateEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = '';
            emojiList.forEach(emoji => { picker.innerHTML += `<span onclick="selectEmoji('${emoji}', this)">${emoji}</span>`; });
        }
        function selectEmoji(emoji, element) {
            document.getElementById('catIcon').value = emoji;
            document.getElementById('currentCatIcon').innerText = emoji;
            document.querySelectorAll('#emojiPicker span').forEach(el => el.classList.remove('selected'));
            if(element) element.classList.add('selected');
        }

        function showAddModal() {
            let view = viewStack[viewStack.length-1];
            if(view === 'home') openCategoryModal('addMacro');
            if(view === 'subcat') openCategoryModal('addSubcat');
            if(view === 'items') navigate('quickadd', "Aggiungi", true, { macroId: currentMacroId, subId: currentSubId });
        }

        function openCategoryModal(mode, index = null) {
            catModalMode = mode; catTargetIndex = index;
            const titleEl = document.getElementById('catModalTitle');
            const nameEl = document.getElementById('catName');
            document.querySelectorAll('#emojiPicker span').forEach(el => el.classList.remove('selected'));

            if (mode === 'addMacro') { titleEl.innerText = "Nuova Zona"; nameEl.value = ""; selectEmoji("🏠"); }
            else if (mode === 'addSubcat') { titleEl.innerText = "Nuova Sottocategoria"; nameEl.value = ""; selectEmoji("📦"); }
            else if (mode === 'editMacro') { titleEl.innerText = "Modifica Zona"; nameEl.value = db[index].name; selectEmoji(db[index].icon); }
            else if (mode === 'editSubcat') { titleEl.innerText = "Modifica Sottocategoria"; nameEl.value = db[currentMacroId].subcats[index].name; selectEmoji(db[currentMacroId].subcats[index].icon); }
            openModal('modalCategory');
        }

        function saveCategory() {
            const name = document.getElementById('catName').value.trim();
            const icon = document.getElementById('catIcon').value;
            if (!name) { alert("Inserisci un nome!"); return; }

            if (catModalMode === 'addMacro') { db.push({ name, icon, subcats: [] }); renderHome(); }
            else if (catModalMode === 'addSubcat') { db[currentMacroId].subcats.push({ name, icon, items: [] }); openMacro(currentMacroId); }
            else if (catModalMode === 'editMacro') { db[catTargetIndex].name = name; db[catTargetIndex].icon = icon; renderHome(); }
            else if (catModalMode === 'editSubcat') { db[currentMacroId].subcats[catTargetIndex].name = name; db[currentMacroId].subcats[catTargetIndex].icon = icon; openMacro(currentMacroId); }
            saveDB(); closeModal('modalCategory');
        }

        function deleteMacro(index) { if(confirm("Eliminare questa zona e tutto il contenuto?")) { db.splice(index, 1); saveDB(); renderHome(); } }
        function deleteSubcat(index) { if(confirm("Eliminare questa sottocategoria?")) { db[currentMacroId].subcats.splice(index, 1); saveDB(); openMacro(currentMacroId); } }

        function openEditModal(index) {
            editingItemIndex = index;
            let item = db[currentMacroId].subcats[currentSubId].items[index];
            document.getElementById('editName').value = item.name;
            document.getElementById('editQty').value = item.qty;
            document.getElementById('editPos').value = item.pos || '';
            document.getElementById('editNotes').value = item.notes || '';
            
            // Gestione foto esistente
            editPhotoBase64 = item.image || null;
            if (item.image) {
                document.getElementById('editPhotoPreview').src = item.image;
                document.getElementById('editPhotoPreview').style.display = 'block';
                document.getElementById('editRemoveBtn').style.display = 'inline-block';
            } else {
                removeImage('editPhotoInput', 'editPhotoPreview', 'editRemoveBtn', 'edit');
            }

            openModal('modalEdit');
        }

        function saveEdit() {
            let item = db[currentMacroId].subcats[currentSubId].items[editingItemIndex];
            item.name = document.getElementById('editName').value;
            item.qty = document.getElementById('editQty').value;
            item.pos = document.getElementById('editPos').value;
            item.notes = document.getElementById('editNotes').value;
            item.image = editPhotoBase64; // Salva la foto (o null se rimossa)

            saveDB(); closeModal('modalEdit'); renderItems();
        }

        function openMoveModal(index) {
            editingItemIndex = index;
            let item = db[currentMacroId].subcats[currentSubId].items[index];
            document.getElementById('moveItemName').innerText = `Stai spostando: ${item.name}`;
            document.getElementById('movePos').value = item.pos || '';
            populateMacroSelects('moveMacro', 'moveSubcat', currentMacroId, currentSubId);
            openModal('modalMove');
        }

        function saveMove() {
            let newMacroId = document.getElementById('moveMacro').value;
            let newSubId = document.getElementById('moveSubcat').value;
            let newPos = document.getElementById('movePos').value;
            if(newMacroId === "" || newSubId === "") { alert("Seleziona Zona e Sottocategoria valide."); return; }
            let itemToMove = db[currentMacroId].subcats[currentSubId].items.splice(editingItemIndex, 1)[0];
            itemToMove.pos = newPos;
            db[newMacroId].subcats[newSubId].items.push(itemToMove);
            saveDB(); closeModal('modalMove');
            currentMacroId = newMacroId; openSubcat(newSubId);
        }

        function deleteItem(index) { if(confirm("Rimuovere questo elemento?")) { db[currentMacroId].subcats[currentSubId].items.splice(index, 1); saveDB(); renderItems(); } }

        function populateMacroSelects(macroSelectId, subcatSelectId, prefillMacroId = null, prefillSubId = null) {
            const macroSelect = document.getElementById(macroSelectId);
            macroSelect.innerHTML = '<option value="">Seleziona Zona...</option>';
            db.forEach((m, i) => {
                let selected = (prefillMacroId !== null && parseInt(prefillMacroId) === i) ? 'selected' : '';
                macroSelect.innerHTML += `<option value="${i}" ${selected}>${m.name}</option>`;
            });
            updateSubcatSelect(macroSelectId, subcatSelectId, prefillSubId);
        }

        function updateSubcatSelect(macroSelectId, subcatSelectId, prefillSubId = null) {
            const macroSelect = document.getElementById(macroSelectId);
            const subcatSelect = document.getElementById(subcatSelectId);
            subcatSelect.innerHTML = '<option value="">Seleziona Sottocategoria...</option>';
            if(macroSelect.value !== "") {
                db[macroSelect.value].subcats.forEach((s, i) => {
                    let checkId = (typeof prefillSubId === 'object') ? null : prefillSubId;
                    let selected = (checkId !== null && parseInt(checkId) === i) ? 'selected' : '';
                    subcatSelect.innerHTML += `<option value="${i}" ${selected}>${s.name}</option>`;
                });
            }
        }

        function saveQuickAdd() {
            let name = document.getElementById('qaName').value;
            let qty = document.getElementById('qaQty').value;
            let pos = document.getElementById('qaPos').value;
            let notes = document.getElementById('qaNotes').value;
            let mId = document.getElementById('qaMacro').value;
            let sId = document.getElementById('qaSubcat').value;

            if(!name || mId === "" || sId === "") { alert("Compila il nome e seleziona Zona e Sottocategoria."); return; }

            // Aggiungiamo anche qaPhotoBase64 all'oggetto
            db[mId].subcats[sId].items.push({ name, qty: qty || 1, pos, notes, image: qaPhotoBase64 }); 
            saveDB();
            
            document.getElementById('qaName').value = ''; document.getElementById('qaQty').value = '1';
            document.getElementById('qaPos').value = ''; document.getElementById('qaNotes').value = '';
            removeImage('qaPhotoInput', 'qaPhotoPreview', 'qaRemoveBtn', 'qa');
            
            currentMacroId = mId; openSubcat(sId);
        }

        function toggleTheme() {
            let isDark = document.getElementById('themeToggle').checked;
            if(isDark) { document.body.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); } 
            else { document.body.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
        }

        function updateBackupDate() {
            let d = new Date().toLocaleString('it-IT');
            localStorage.setItem('lastBackup', d); 
            document.getElementById('lastBackupDate').innerText = d;
        }

        function downloadLocal() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "backup_inventario.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click(); downloadAnchorNode.remove();
            updateBackupDate(); closeModal('modalExport');
        }

        async function shareBackup() {
            const fileName = 'backup_inventario.json';
            const fileContent = JSON.stringify(db);
            const file = new File([fileContent], fileName, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Backup Inventario', text: 'Ecco il file di backup del nostro inventario.' });
                    updateBackupDate(); closeModal('modalExport');
                } catch (err) { console.log('Condivisione annullata', err); }
            } else {
                alert("Il tuo browser non supporta la condivisione diretta. Verrà scaricato sul telefono."); downloadLocal();
            }
        }

        function importData() {
            const file = document.getElementById('importFile').files[0];
            if(!file) { alert("Seleziona un file!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                try { db = JSON.parse(e.target.result); saveDB(); alert("Backup caricato con successo!"); navigate('home'); } 
                catch(err) { alert("Errore nel file di backup."); }
            };
            reader.readAsText(file);
        }

        init();
    </script>
</body>
</html>
